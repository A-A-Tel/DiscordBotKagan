  db:
    image: mysql:latest
    restart: always
    build:
      context: ./db/
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    ports:
      - "3306:3306"
    volumes:
      - bot_data:/var/lib/mysql
      - ./db/init.sql:/var/init.sql

volumes:
  bot_data: